<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" aria-label="Результат разбора" hidden>
    <p>Тема — <strong id="topic"></strong></p>
    <p>Черновик ответа</p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicNames = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Стоимость"],
      ["other", "Другое"],
    ]);
    let latestSubmission = 0;

    function showInvalidInput() {
      status.textContent = "Введите текст заявки.";
      message.setAttribute("aria-invalid", "true");
      message.focus();
    }

    message.addEventListener("input", () => message.removeAttribute("aria-invalid"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submission = ++latestSubmission;
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      message.removeAttribute("aria-invalid");

      const text = message.value.trim();
      if (!text) {
        showInvalidInput();
        return;
      }

      status.textContent = "Разбираем заявку…";
      let reply;
      let triage;
      try {
        reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        triage = await reply.json();
      } catch {
        triage = null;
      }

      if (submission !== latestSubmission) return;

      if (reply?.status === 400 && triage?.status === "invalid_input") {
        showInvalidInput();
        return;
      }

      const topicName = topicNames.get(triage?.topic);
      if (reply?.ok && triage?.status === "ready" && topicName &&
          typeof triage.draft === "string" && triage.draft.trim()) {
        topic.textContent = topicName;
        draft.textContent = triage.draft;
        result.hidden = false;
        status.textContent = "Черновик готов. Проверьте его перед отправкой.";
        return;
      }

      status.textContent = "Нужен ручной разбор. Подготовьте ответ на заявку вручную.";
    });
  </script>
</body>
</html>
